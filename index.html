<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Fund - Private Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff5f7; color: #4a1d24; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 77, 109, 0.1); }
        
        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed; inset: 0; background: #fff5f7; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }

        /* HEART ANIMATION */
        .heart-container { position: relative; width: 200px; height: 180px; margin: 0 auto; filter: drop-shadow(0 10px 20px rgba(255, 77, 109, 0.2)); }
        .heart-svg { width: 100%; height: 100%; fill: #f8fafc; position: absolute; z-index: 10; }
        .liquid-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: url(#heart-mask); z-index: 5; }
        .water {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; 
            background: linear-gradient(to top, #ff0a54, #ff4d6d);
            transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1), background 1.5s ease;
        }
        .water::before {
            content: ""; position: absolute; width: 200%; height: 200%; top: -15%; left: -50%;
            background: rgba(255, 255, 255, 0.3); border-radius: 38%; animation: wave 6s linear infinite;
        }
        @keyframes wave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .heart-beat { animation: heartPulse 2.5s infinite ease-in-out; }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .loader-overlay { position: fixed; inset: 0; background: rgba(255, 245, 247, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        .pink-gradient { background: linear-gradient(135deg, #ff4d6d 0%, #ff0a54 100%); }
        #main-content { display: none; } /* Tersembunyi sebelum login */
    </style>
</head>
<body class="pb-20">

    <!-- LOGIN SCREEN -->
    <div id="login-overlay" class="animate__animated">
        <div class="glass p-10 rounded-[3rem] shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="text-4xl mb-6 animate__animated animate__heartBeat animate__infinite">🔒</div>
            <h2 class="text-2xl font-black text-pink-600 mb-2">Private Access</h2>
            <p class="text-pink-300 text-sm mb-6 font-medium">Masukkan password kalian berdua</p>
            <input type="password" id="pw-input" placeholder="Password..." 
                class="w-full p-4 rounded-2xl bg-pink-50 border-none outline-none ring-2 ring-pink-100 focus:ring-pink-400 mb-4 text-center font-bold">
            <button onclick="checkPassword()" 
                class="w-full pink-gradient text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">Buka Brankas ✨</button>
            <p id="pw-error" class="text-red-400 text-xs mt-4 font-bold hidden">Password salah sayang! ❌</p>
        </div>
    </div>

    <!-- MAIN CONTENT (Akan muncul setelah login) -->
    <div id="main-content">
        <!-- LOADER -->
        <div id="loader" class="loader-overlay">
            <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="font-bold text-pink-600 animate-pulse uppercase tracking-widest text-xs">Sinkronisasi Cloud...</p>
        </div>

        <!-- MODAL EDIT -->
        <div id="editModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-pink-900/20 backdrop-blur-sm">
            <div class="glass w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl animate__animated animate__zoomIn">
                <h3 class="text-xl font-bold mb-6 text-pink-600">Ubah Catatan Cinta ✏️</h3>
                <div class="space-y-4">
                    <input type="hidden" id="editId">
                    <select id="editWho" class="w-full bg-pink-50 border-none rounded-2xl p-4 outline-none ring-1 ring-pink-100">
                        <option value="p1">Partner 1</option>
                        <option value="p2">Partner 2</option>
                    </select>
                    <input type="number" id="editAmount" class="w-full bg-pink-50 border-none rounded-2xl p-4 outline-none ring-1 ring-pink-100 font-bold">
                    <input type="text" id="editDesc" class="w-full bg-pink-50 border-none rounded-2xl p-4 outline-none ring-1 ring-pink-100">
                    <div class="flex gap-3 pt-4">
                        <button onclick="closeModal()" class="flex-1 py-3 font-bold text-pink-300">Batal</button>
                        <button onclick="saveEdit()" class="flex-1 pink-gradient text-white py-3 rounded-2xl font-bold shadow-lg">Simpan</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="max-w-4xl mx-auto px-4 pt-12">
            <header class="text-center mb-10 animate__animated animate__fadeIn">
                <h1 class="text-4xl font-black text-pink-600 tracking-tight mb-2 uppercase italic">Our Pink Fund 💖</h1>
                <p class="text-pink-300 font-medium tracking-widest text-xs uppercase italic">Synchronized Spreadsheet</p>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-8">
                    <!-- MAIN CARD -->
                    <div class="glass rounded-[3rem] p-12 shadow-2xl text-center relative overflow-hidden border-none">
                        <div class="heart-container heart-beat mb-8">
                            <svg class="heart-svg" viewBox="0 0 32 29.6">
                                <defs><clipPath id="heart-mask"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></clipPath></defs>
                                <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z" fill="#fceef2" />
                            </svg>
                            <div class="liquid-container"><div id="water-fill" class="water"></div></div>
                            <div class="absolute inset-0 flex items-center justify-center z-20"><span id="percent-text" class="text-3xl font-black text-pink-900">0%</span></div>
                        </div>
                        <p class="text-pink-300 text-[10px] font-bold uppercase tracking-[0.3em] mb-2">Tabungan Terkumpul</p>
                        <p id="total-balance" class="text-6xl font-black text-pink-600 tracking-tighter mb-6">Rp 0</p>
                        <div class="inline-block px-8 py-3 rounded-2xl bg-pink-50 text-pink-500 font-bold text-sm shadow-inner">Target: Rp 10.000.000</div>
                    </div>

                    <!-- PARTNER CARDS -->
                    <div class="grid grid-cols-2 gap-6 animate__animated animate__fadeInUp">
                        <div class="glass rounded-[2rem] p-6 text-center border-b-4 border-pink-200">
                            <p class="text-[10px] font-black text-pink-300 uppercase tracking-widest mb-1">Partner 1</p>
                            <p id="p1-total" class="text-2xl font-black text-pink-600 tracking-tight">Rp 0</p>
                        </div>
                        <div class="glass rounded-[2rem] p-6 text-center border-b-4 border-pink-200">
                            <p class="text-[10px] font-black text-pink-300 uppercase tracking-widest mb-1">Partner 2</p>
                            <p id="p2-total" class="text-2xl font-black text-pink-600 tracking-tight">Rp 0</p>
                        </div>
                    </div>
                </div>

                <!-- FORM SIDEBAR -->
                <div class="space-y-6">
                    <div class="glass rounded-[2.5rem] p-8 shadow-2xl border-none">
                        <h3 class="font-bold text-xl mb-6 text-pink-600">Isi Brankas 🍬</h3>
                        <div class="space-y-4">
                            <select id="contributor" class="w-full bg-pink-50 border-none rounded-2xl p-4 outline-none ring-2 ring-pink-100 focus:ring-pink-400">
                                <option value="p1">Partner 1</option>
                                <option value="p2">Partner 2</option>
                            </select>
                            <input type="number" id="amount" placeholder="Nominal Rp" class="w-full bg-pink-50 border-none rounded-2xl p-4 outline-none ring-2 ring-pink-100 focus:ring-pink-400 font-bold">
                            <input type="text" id="desc" placeholder="Untuk apa?" class="w-full bg-pink-50 border-none rounded-2xl p-4 outline-none ring-2 ring-pink-100 focus:ring-pink-400">
                            <button onclick="addEntry()" class="w-full pink-gradient text-white font-bold py-5 rounded-2xl shadow-xl transition-all">Simpan ke Cloud ✨</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HISTORY -->
            <div class="mt-12 bg-white/60 rounded-[3rem] shadow-xl overflow-hidden">
                <div class="p-8 border-b border-pink-50 flex justify-between items-center bg-white/40">
                    <h3 class="font-bold text-xl text-pink-600 tracking-tighter">Riwayat Perjalanan</h3>
                    <button onclick="resetCloud()" class="text-[10px] font-bold text-pink-300 hover:text-red-400 transition-colors uppercase tracking-widest">Reset Semua</button>
                </div>
                <div id="history-list" class="divide-y divide-pink-50"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. PENGATURAN PASSWORD & API
        const MY_PASSWORD = "7E"; // GANTI PASSWORD DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz6N_BsN4HVYKVIw5wqhfGIBVLnuYYOWUvy74dUjy923nwxse6kJbR_05d-HnsMmpj/exec";
        
        let cloudHistory = [];
        const GOAL = 10000000;

        // 2. FUNGSI LOGIN
        function checkPassword() {
            const input = document.getElementById('pw-input').value;
            const errorMsg = document.getElementById('pw-error');
            
            if (input === MY_PASSWORD) {
                // Simpan status login di session (hilang jika tab ditutup)
                sessionStorage.setItem('isLoggedIn', 'true');
                unlockApp();
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('pw-input').value = '';
                // Efek getar jika salah
                const loginBox = document.querySelector('#login-overlay .glass');
                loginBox.classList.add('animate__animated', 'animate__shakeX');
                setTimeout(() => loginBox.classList.remove('animate__shakeX'), 500);
            }
        }

        function unlockApp() {
            const overlay = document.getElementById('login-overlay');
            const main = document.getElementById('main-content');
            
            overlay.classList.add('animate__fadeOut');
            setTimeout(() => {
                overlay.style.display = 'none';
                main.style.display = 'block';
                fetchFromCloud(); // Baru ambil data setelah login
            }, 500);
        }

        // Jalankan saat load
        window.onload = () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                unlockApp();
            }
        };

        // 3. FUNGSI DATA CLOUD
        async function fetchFromCloud() {
            showLoader(true);
            try {
                const response = await fetch(SCRIPT_URL);
                cloudHistory = await response.json();
                updateUI();
            } catch (e) { console.error(e); }
            showLoader(false);
        }

        async function addEntry() {
            const who = document.getElementById('contributor').value;
            const amount = parseInt(document.getElementById('amount').value);
            const desc = document.getElementById('desc').value || "Tabungan";
            if (!amount) return;

            showLoader(true);
            const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'add', who, amount, desc, date: dateStr })
                });
                await fetchFromCloud();
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff0a54', '#ff4d6d'] });
                document.getElementById('amount').value = '';
                document.getElementById('desc').value = '';
            } catch (e) { alert("Gagal!"); }
            showLoader(false);
        }

        function openEditModal(idx) {
            const item = cloudHistory[idx];
            document.getElementById('editId').value = item.id;
            document.getElementById('editWho').value = item.who;
            document.getElementById('editAmount').value = item.amount;
            document.getElementById('editDesc').value = item.desc;
            document.getElementById('editModal').classList.remove('hidden');
        }

        async function saveEdit() {
            const id = parseInt(document.getElementById('editId').value);
            const who = document.getElementById('editWho').value;
            const amount = parseInt(document.getElementById('editAmount').value);
            const desc = document.getElementById('editDesc').value;
            const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

            showLoader(true);
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'edit', id, who, amount, desc, date: dateStr })
                });
                closeModal();
                await fetchFromCloud();
            } catch (e) { alert("Gagal update!"); }
            showLoader(false);
        }

        async function deleteEntry(id) {
            if(!confirm("Hapus data ini selamanya?")) return;
            showLoader(true);
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', id })
                });
                await fetchFromCloud();
            } catch (e) { alert("Gagal hapus!"); }
            showLoader(false);
        }

        async function resetCloud() {
            if(!confirm("Hapus seluruh data di cloud?")) return;
            showLoader(true);
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'clear' }) });
            await fetchFromCloud();
            showLoader(false);
        }

        function updateUI() {
            const totals = { p1: 0, p2: 0, total: 0 };
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            cloudHistory.slice().reverse().forEach((item, index) => {
                const actualIdx = cloudHistory.length - 1 - index;
                const amt = parseInt(item.amount);
                totals[item.who] += amt;
                totals.total += amt;

                const div = document.createElement('div');
                div.className = "p-6 flex justify-between items-center group hover:bg-white/80 transition-all";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center bg-pink-100 text-pink-500 font-bold text-xs">${item.who.toUpperCase()}</div>
                        <div><p class="font-bold text-sm text-slate-700">${item.desc}</p><p class="text-[10px] text-pink-300 uppercase">${item.date}</p></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="font-black text-pink-500">+ ${formatRupiah(amt)}</p>
                        <div class="opacity-0 group-hover:opacity-100 transition-all flex gap-1">
                            <button onclick="openEditModal(${actualIdx})" class="p-2 text-pink-200 hover:text-pink-500">✎</button>
                            <button onclick="deleteEntry(${item.id})" class="p-2 text-pink-200 hover:text-red-400">✕</button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });

            const percent = Math.min((totals.total / GOAL) * 100, 100).toFixed(0);
            document.getElementById('total-balance').innerText = formatRupiah(totals.total);
            document.getElementById('p1-total').innerText = formatRupiah(totals.p1);
            document.getElementById('p2-total').innerText = formatRupiah(totals.p2);
            document.getElementById('percent-text').innerText = percent + '%';
            
            const water = document.getElementById('water-fill');
            water.style.height = percent + '%';
            const sat = 60 + (percent * 0.3); 
            const light = 85 - (percent * 0.4);
            water.style.background = `linear-gradient(to top, hsl(340, ${sat}%, ${light - 10}%), hsl(340, ${sat}%, ${light}%))`;
        }

        // Helper Functions
        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }
        function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
        function formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num); }
    </script>
</body>
</html>
